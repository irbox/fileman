name: Build and Release OpenCX APK

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required for softprops/action-gh-release to upload release assets

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Step 1: Generate debug.keystore if not present, ensure gradlew, and compile Debug APK
      - name: Build Debug APK
        run: |
          if [ ! -f debug.keystore ]; then
            echo "Generating debug keystore for CI build..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          if [ ! -f gradlew ]; then
            gradle wrapper
          fi
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      # Step 2: Upload APK to Artifacts
      - name: Upload Raw APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LibreFiles-Debug.apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # Step 3: Publish directly to GitHub Releases
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.ref_name || 'v1.0.0-preview' }}
          name: LibreFiles ${{ github.ref_name || 'v1.0.0 Preview' }}
          files: app/build/outputs/apk/debug/app-debug.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
